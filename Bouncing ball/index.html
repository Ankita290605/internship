<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
        <div id="heading">
            <h1>BOUNCING BALL</h1>
        </div>
        <img src="https://www.hdwallpapers.in/download/black_cubes_geometric_shapes_dark_background_hd_dark-1600x900.jpg" alt="">
 
        <div id="box">
            <canvas id="canvas"></canvas>
        </div>

       
    </div>
    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 800;
        canvas.height = 600;
        let balls = [];
        class Ball {
            constructor(x, y, s = 15) {
                this.x = x;
                this.y = y;
                this.s = s;
                this.color = `rgb(${Math.random() * 360}, ${Math.random() * 360}, ${Math.random() * 360})`;
                const angle = Math.random() * 2 * 3.14; 
                const speed = 3;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.rotation = 0;
                this.rotationSpeed = (Math.random()-0.5) * 0.2;
            }
             draw() {
                ctx.save();
                ctx.translate(this.x + this.s / 2, this.y + this.s / 2); 
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.s / 2, -this.s / 2, this.s, this.s);
                ctx.restore();
            }
        
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x + this.s > canvas.width || this.x < 0) {
                    this.vx *= -1;
                }
                if (this.y + this.s > canvas.height || this.y < 0) {
                    this.vy *= -1;
                }

                this.rotation += this.rotationSpeed;
                this.draw();
            }

        }
        canvas.addEventListener("click", (e) => {
            const rect = canvas.getBoundingClientRect();

            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            balls.push(new Ball(x, y));
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
           
            for (let ball of balls) {
            ball.update();
            }
            requestAnimationFrame(animate);
        }

        animate();
    </script>

</body> 
</html>
